name: Update Today's Matches

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's matches
        run: python src/fetcher.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          LAST_MSG=$(git log -1 --pretty=%s)
          if [ "$LAST_MSG" = "chore: live update [skip ci]" ]; then
            git commit --amend --no-edit -m "chore: live update [skip ci]"
            git push --force-with-lease
          else
            git commit -m "chore: live update [skip ci]"
            git pull --rebase origin main
            git push
          fi
