name: Update All Matches

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all matches (30 days back)
        run: python src/fetcher.py 30

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git fetch origin main
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          LAST_MSG=$(git log -1 --pretty=%s)

          if [ "$LOCAL_SHA" = "$REMOTE_SHA" ] && [ "$LAST_MSG" = "chore: live update [skip ci]" ]; then
            git commit --amend --no-edit -m "chore: live update [skip ci]"
            git push --force-with-lease origin main
          else
            git commit -m "chore: live update [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
