<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mody-API</title>
<style>
  body {
    font-family: monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
    margin: 0;
  }
  pre {
    background: #161b22;
    padding: 20px;
    border-radius: 8px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.6;
  }
  .loading {
    color: #58a6ff;
    padding: 20px;
    text-align: center;
    font-size: 16px;
  }
  .error {
    color: #f85149;
    background: #2d1618;
    padding: 15px;
    border-radius: 8px;
    margin: 10px 0;
  }
</style>
</head>
<body>
<div id="output"><div class="loading">⏳ جارٍ تحميل البيانات...</div></div>

<script>
(async function() {
  const output = document.getElementById('output');
  
  try {
    // ====== قراءة معاملات الرابط ======
    const params = new URLSearchParams(window.location.search);
    let date = params.get('date');
    let lang = params.get('lang') || '27';
    let time = params.get('time');
    
    // إذا لم يُحدد تاريخ، استخدم تاريخ اليوم
    if (!date) {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      date = `${y}-${m}-${d}`;
    }
    
    // إذا لم يُحدد time، احسبه من توقيت المتصفح
    if (!time) {
      const offset = -new Date().getTimezoneOffset();
      const sign = offset >= 0 ? '+' : '-';
      const abs = Math.abs(offset);
      const hh = String(Math.floor(abs / 60)).padStart(2, '0');
      const mm = String(abs % 60).padStart(2, '0');
      time = `${sign}${hh}:${mm}`;
    }
    
    // ====== بناء رابط المصدر ======
    const SOURCE = 'https://www.messisporat.com/matches/npm/';
    const fullUrl = `${SOURCE}?date=${encodeURIComponent(date)}&lang=${encodeURIComponent(lang)}&time=${encodeURIComponent(time)}`;
    
    // ====== جلب البيانات ======
    const response = await fetch(fullUrl, {
      headers: {
        'Accept': 'application/json, text/plain, */*',
        'Accept-Language': 'ar,en-US;q=0.9,en;q=0.8'
      }
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    
    // ====== عرض البيانات كـ JSON ======
    output.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    
  } catch (err) {
    output.innerHTML = '<div class="error">❌ خطأ: ' + err.message + '</div>' +
      '<div style="margin-top:15px;color:#8b949e">' +
      'تأكد من صحة المعاملات. مثال:<br>' +
      '<code>?date=2026-10-16&lang=27&time=+03:00</code>' +
      '</div>';
  }
})();
</script>
</body>
</html>
