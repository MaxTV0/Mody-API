<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Mody-API</title>
<style>
  body {
    font-family: monospace;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
    margin: 0;
  }
  pre {
    background: #161b22;
    padding: 20px;
    border-radius: 8px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.6;
  }
  .loading {
    color: #58a6ff;
    padding: 20px;
    text-align: center;
    font-size: 16px;
  }
  .error {
    color: #f85149;
    background: #2d1618;
    padding: 15px;
    border-radius: 8px;
    margin: 10px 0;
  }
</style>
</head>
<body>
<div id="output"><div class="loading">⏳ جارٍ تحميل البيانات...</div></div>

<script>
(async function() {
  const output = document.getElementById('output');
  
  try {
    const params = new URLSearchParams(window.location.search);
    let date = params.get('date');
    let lang = params.get('lang') || '27';
    let time = params.get('time');
    
    if (!date) {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      date = `${y}-${m}-${d}`;
    }
    
    if (!time) {
      const offset = -new Date().getTimezoneOffset();
      const sign = offset >= 0 ? '+' : '-';
      const abs = Math.abs(offset);
      const hh = String(Math.floor(abs / 60)).padStart(2, '0');
      const mm = String(abs % 60).padStart(2, '0');
      time = `${sign}${hh}:${mm}`;
    }
    
    const SOURCE = 'https://www.messisporat.com/matches/npm/';
    const fullUrl = `${SOURCE}?date=${encodeURIComponent(date)}&lang=${encodeURIComponent(lang)}&time=${encodeURIComponent(time)}`;
    
    // ====== استخدام CORS Proxy ======
    const proxies = [
      'https://corsproxy.io/?' + encodeURIComponent(fullUrl),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(fullUrl),
      'https://cors.eu.org/' + fullUrl,
    ];
    
    let data = null;
    let lastError = null;
    
    for (const proxyUrl of proxies) {
      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        data = JSON.parse(text);
        break;
      } catch (err) {
        lastError = err;
        continue;
      }
    }
    
    if (!data) {
      throw new Error('فشلت جميع الوسائط: ' + (lastError?.message || 'unknown'));
    }
    
    output.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    
  } catch (err) {
    output.innerHTML = '<div class="error">❌ خطأ: ' + err.message + '</div>' +
      '<div style="margin-top:15px;color:#8b949e">' +
      'حاول مرة أخرى بعد قليل، أو استخدم رابط raw.' +
      '</div>';
  }
})();
</script>
</body>
</html>
